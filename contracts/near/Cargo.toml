[package]
name = "blackout-resources"
version = "0.1.0"
edition = "2021"
description = "BLACKOUT game resources: one NEP-245 multi-token contract holding every item type (diesel, carbon permits, parts)."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
